    border-color: rgba(255, 255, 255, 0.25);
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes pulse_normal {
    0% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(46, 139, 87, 0.2)); opacity: 0.8; }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 6px rgba(46, 139, 87, 0.6)); opacity: 1; }
    100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(46, 139, 87, 0.2)); opacity: 0.8; }
  }
  @keyframes pulse_critical {
    0% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(192, 57, 43, 0.5)); opacity: 0.6; }
    50% { transform: scale(1.18); filter: drop-shadow(0 0 14px rgba(192, 57, 43, 1)); opacity: 1; }
    100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(192, 57, 43, 0.5)); opacity: 0.6; }
  }
